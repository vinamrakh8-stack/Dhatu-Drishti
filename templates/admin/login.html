<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Dhatu Drishti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#050A10;--panel:#0C1620;--panel-2:#0F1C29;
 --glass:rgba(255,255,255,.045);--glass-brd:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);
 --text:#EDF4F7;--text-dim:#94A9B8;--text-faint:#59707F;
 --green:#27C98B;--green-soft:rgba(39,201,139,.14);--cyan:#2FCFE8;--cyan-soft:rgba(47,207,232,.14);
 --ore:#E3A857;--ore-soft:rgba(227,168,87,.14);--red:#EF6461;--red-soft:rgba(239,100,97,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:28px 18px;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse 85% 55% at 50% 0%,black 35%,transparent 88%)}
button,input{font:inherit}
.login-box{position:relative;z-index:1;width:min(400px,100%);background:linear-gradient(145deg,var(--panel-2),var(--panel));border:1px solid var(--glass-brd);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.55);padding:32px 28px}
.login-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.75}
.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:22px}
.brand-logo{width:40px;height:40px}
.brand-name{font-family:'Manrope';font-size:17px;font-weight:800;letter-spacing:.04em}
h1{font-family:'Manrope';font-size:20px;text-align:center;letter-spacing:.14em;text-transform:uppercase}
.sub{text-align:center;font-size:12.5px;color:var(--text-faint);margin-top:8px;line-height:1.6}
.field{display:grid;gap:7px;margin-top:18px}
.field label{font-size:11px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.field input{width:100%;background:#09131d;color:var(--text);border:1px solid var(--glass-brd);border-radius:10px;padding:12px 13px;outline:none}
.field input:focus{border-color:rgba(47,207,232,.55);box-shadow:0 0 0 3px rgba(47,207,232,.08)}
.field input::placeholder{color:var(--text-faint)}
.error{margin-top:18px;border:1px solid rgba(239,100,97,.32);background:var(--red-soft);color:var(--red);border-radius:10px;padding:11px 13px;font-size:12.5px;font-weight:600;line-height:1.5}
.submit{width:100%;margin-top:22px;border:0;border-radius:10px;padding:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12.5px;background:linear-gradient(120deg,var(--green),#1ca46f);color:#03140c;cursor:pointer}
.submit:hover{transform:translateY(-1px)}
.foot{margin-top:18px;text-align:center;font-size:11.5px;color:var(--text-faint);line-height:1.6}
.foot a{color:var(--cyan);text-decoration:none}
.foot a:hover{text-decoration:underline}
</style>
</head>
<body>
 <div class="login-box">
  <div class="brand">
   <svg class="brand-logo" viewBox="0 0 44 44" fill="none">
    <rect x=".5" y=".5" width="43" height="43" rx="11" fill="#081018" stroke="rgba(255,255,255,.09)"/>
    <path d="M7 22C12 15 17 12 22 12c5 0 10 3 15 10-5 7-10 10-15 10-5 0-10-3-15-10Z" stroke="#2FCFE8" stroke-width="1.6"/>
    <path d="m22 16.5 4 5.5-4 5.5-4-5.5 4-5.5Z" fill="#27C98B"/>
    <ellipse cx="22" cy="22" rx="17.5" ry="7" stroke="#E3A857" stroke-width="1" stroke-dasharray="1.6 2.6"/>
   </svg>
   <span class="brand-name">DHATU DRISHTI</span>
  </div>

  <h1>Admin Login</h1>
  <p class="sub">Sign in with an administrator account to manage machinery and review AI report history.</p>

  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}

  <form method="post" action="{{ url_for('admin.login', next=request.args.get('next')) }}" autocomplete="on">
   <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

   <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email }}" placeholder="admin@example.com"
           required autofocus autocomplete="username">
   </div>

   <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="••••••••"
           required autocomplete="current-password">
   </div>

   <button class="submit" type="submit">Login</button>
  </form>

  <p class="foot">Protected area · <a href="/">Back to dashboard</a></p>
 </div>
</body>
</html>
