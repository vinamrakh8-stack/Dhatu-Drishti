<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhatu Drishti — {{ code }}</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#050A10;--glass:rgba(255,255,255,.045);--glass-brd:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);
 --text:#EDF4F7;--text-dim:#94A9B8;--text-faint:#59707F;
 --cyan:#2FCFE8;--cyan-soft:rgba(47,207,232,.14);--red:#EF6461;--red-soft:rgba(239,100,97,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:30px 18px}
.card{width:min(520px,100%);background:linear-gradient(160deg,var(--glass),rgba(255,255,255,.015));border:1px solid var(--glass-brd);border-radius:20px;padding:34px;text-align:center;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.7}
.code{font-family:'Manrope';font-size:64px;font-weight:800;background:linear-gradient(95deg,#fff 40%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
h1{font-family:'Manrope';font-size:20px;margin-top:12px}
p{color:var(--text-dim);font-size:14px;line-height:1.65;margin-top:10px}
.actions{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.btn{border:1px solid var(--glass-brd);border-radius:10px;padding:11px 17px;font-weight:700;color:var(--text);background:var(--glass);text-decoration:none;display:inline-flex;align-items:center}
.btn-primary{background:var(--cyan-soft);color:var(--cyan);border-color:rgba(47,207,232,.35)}
.btn:hover{transform:translateY(-1px)}
</style>
</head>
<body>
 <div class="card">
  <div class="code">{{ code }}</div>
  <h1>{{ 'Forbidden' if code == 403 else 'Page not found' if code == 404 else 'Request failed' }}</h1>
  <p>{{ message }}</p>
  <div class="actions">
   <a class="btn btn-primary" href="/">Back to dashboard</a>
   <a class="btn" href="/machinery">Machinery</a>
  </div>
 </div>
</body>
</html>
